[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = "0.8.26"
auto_detect_solc = false

optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"